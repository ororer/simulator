name: Run Daily Paper Trading Engine

on:
  schedule:
    # ימים שני עד שישי בשעה 21:30 UTC (חצי שעה לאחר נעילת וול סטריט)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # כפתור להפעלה ידנית לבדיקות

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install pandas numpy yfinance requests; fi

      - name: Execute Simulation Engine
        run: |
          python src/paper_engine.py

      - name: Commit and Push Portfolio Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if git diff --staged --quiet; then
            echo "No portfolio changes detected. Skipping commit."
          else
            git commit -m "Auto: Daily paper trading engine update [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
