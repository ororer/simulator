<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚔️ קרב התיקים — Paper Trading Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Heebo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090c10;
            --surface: #111620;
            --surface-subtle: #171e2c;
            --border: #21293a;
            --text-main: #f0f4f8;
            --text-sub: #8692a6;
            --accent: #3b82f6;
            --purple: #8b5cf6;
            --green: #10b981;
            --red: #f43f5e;
            --warn: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text-main); padding: 16px 12px 60px; }
        .app-container { max-width: 650px; margin: auto; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .brand-title { font-size: 1.35rem; font-weight: 900; display: flex; align-items: center; gap: 6px; }
        .back-link { background: #1e293b; color: var(--accent); text-decoration: none; font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(59,130,246,0.3); }

        .battle-card { background: linear-gradient(180deg, #111620 0%, #0d121a 100%); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
        .battle-header { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 10px; font-weight: 700; text-align: center; }
        .battle-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .battle-row:last-child { border-bottom: none; }
        .b-name { font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; }
        .b-score { font-family: 'Plus Jakarta Sans'; font-weight: 800; font-size: 0.95rem; }

        .port-switcher { display: flex; gap: 6px; margin-bottom: 12px; }
        .switch-btn { flex: 1; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); font-size: 0.8rem; font-weight: 700; cursor: pointer; }
        .switch-btn.active { background: var(--surface-subtle); color: var(--text-main); border-color: var(--accent); }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
        .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 6px; text-align: center; }
        .kpi-label { font-size: 0.7rem; color: var(--text-sub); margin-bottom: 2px; }
        .kpi-val { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.95rem; font-weight: 800; }

        .nav-tabs { display: flex; background: var(--surface); padding: 4px; border-radius: 12px; margin-bottom: 14px; border: 1px solid var(--border); }
        .nav-tab { flex: 1; text-align: center; padding: 8px 4px; font-size: 0.78rem; font-weight: 700; color: var(--text-sub); border: none; background: transparent; border-radius: 8px; cursor: pointer; }
        .nav-tab.active { background: var(--accent); color: #fff; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .clean-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .pos { color: var(--green) !important; }
        .neg { color: var(--red) !important; }

        .form-box { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
        .input-field { background: #0c1017; border: 1px solid var(--border); color: #fff; padding: 8px 10px; border-radius: 8px; font-family: 'Heebo'; font-size: 0.85rem; width: 100%; }
        .btn-submit { width: 100%; background: var(--green); color: #000; font-weight: 800; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

        .trade-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .trade-row:last-child { border-bottom: none; }
        .t-ticker { font-family: 'Plus Jakarta Sans'; font-size: 1.1rem; font-weight: 800; }
        .t-details { font-size: 0.75rem; color: var(--text-sub); }
        .empty-card { text-align: center; padding: 30px; color: var(--text-sub); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="brand-title">⚔️ קרב התיקים <span style="font-size:0.6rem; background:var(--accent); padding:2px 6px; border-radius:4px;">LIVE</span></h1>
            <a href="https://oren-s-market.vercel.app" class="back-link">🌐 סורק השוק</a>
        </header>

        <!-- Battle Card: Triple Comparison -->
        <div class="battle-card">
            <div class="battle-header">🏆 לוח תוצאות — השוואת ביצועי הקרב</div>
            <div class="battle-row">
                <span class="b-name">👤 תיק ידני (Custom)</span>
                <span id="customPerfRow" class="b-score">---%</span>
            </div>
            <div class="battle-row">
                <span class="b-name">🤖 תיק סורק (Screener Agent)</span>
                <span id="screenerPerfRow" class="b-score">---%</span>
            </div>
            <div class="battle-row">
                <span class="b-name">🇺🇸 מדד ייחוס (S&P 500 / SPY)</span>
                <span id="spyPerfRow" class="b-score">---%</span>
            </div>
        </div>

        <!-- Portfolio Selection for Detail View -->
        <div class="port-switcher">
            <button class="switch-btn active" id="btnViewCustom" onclick="switchView('custom')">👤 פירוט תיק אישי</button>
            <button class="switch-btn" id="btnViewScreener" onclick="switchView('screener')">🤖 פירוט תיק סורק</button>
        </div>

        <!-- Dynamic KPIs based on active selected view -->
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">שווי תיק כולל</div>
                <div id="totalEquity" class="kpi-val">$---</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">תשואה כוללת</div>
                <div id="totalPerf" class="kpi-val">---%</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">מזומן זמין</div>
                <div id="cashVal" class="kpi-val">$---</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <button class="nav-tab active" onclick="showTab(event, 'openPos')">📈 פוזיציות פתוחות</button>
            <button class="nav-tab" onclick="showTab(event, 'history')">📜 היסטוריית טריידים</button>
            <button class="nav-tab" onclick="showTab(event, 'addTrade')">➕ הזנת עסקה ידנית</button>
        </nav>

        <div id="openPos" class="tab-panel active">
            <div id="openPositionsContainer"></div>
        </div>

        <div id="history" class="tab-panel">
            <div id="closedTradesContainer"></div>
        </div>

        <div id="addTrade" class="tab-panel">
            <div class="form-box">
                <h3 style="font-size:0.9rem; margin-bottom:8px;">הזנת טרייד ידני לתיק האישי</h3>
                <div class="form-grid">
                    <input type="text" id="inTicker" placeholder="טיקר (למשל PLTR)" class="input-field" style="text-transform:uppercase;">
                    <input type="number" id="inShares" placeholder="כמות מניות" class="input-field">
                    <input type="number" id="inEntry" placeholder="מחיר כניסה ($)" class="input-field" step="0.01">
                    <input type="number" id="inStop" placeholder="סטופ לוס ($)" class="input-field" step="0.01">
                    <input type="number" id="inTp1" placeholder="יעד 1 ($)" class="input-field" step="0.01">
                    <input type="number" id="inTp2" placeholder="יעד 2 ($)" class="input-field" step="0.01">
                </div>
                <input type="password" id="ghToken" placeholder="GitHub Personal Access Token (PAT)" class="input-field" style="margin-bottom:10px;">
                <button onclick="submitManualTrade()" class="btn-submit">🚀 שמור ל-data/portfolio_custom.json</button>
            </div>
        </div>
    </div>

    <script>
        let customPortfolio = null;
        let screenerPortfolio = null;
        let activeView = 'custom'; // 'custom' or 'screener'

        function showTab(evt, tabId) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            evt.currentTarget.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function switchView(viewName) {
            activeView = viewName;
            document.getElementById('btnViewCustom').classList.toggle('active', viewName === 'custom');
            document.getElementById('btnViewScreener').classList.toggle('active', viewName === 'screener');
            renderUI();
        }

        async function fetchAllData() {
            try {
                const [resCustom, resScreener] = await Promise.all([
                    fetch('data/portfolio_custom.json?t=' + Date.now()),
                    fetch('data/portfolio_screener.json?t=' + Date.now())
                ]);

                if (resCustom.ok) customPortfolio = await resCustom.json();
                if (resScreener.ok) screenerPortfolio = await resScreener.json();

                renderUI();
            } catch(e) {
                console.error("Error loading portfolio data:", e);
            }
        }

        function renderScore(elemId, val) {
            const el = document.getElementById(elemId);
            if (!el) return;
            const num = Number(val) || 0;
            el.innerText = (num >= 0 ? '+' : '') + num.toFixed(2) + '%';
            el.className = 'b-score ' + (num >= 0 ? 'pos' : 'neg');
        }

        function renderUI() {
            // 1. Update Triple Battle Card
            if (customPortfolio) {
                renderScore('customPerfRow', customPortfolio.total_performance_pct);
            }
            if (screenerPortfolio) {
                renderScore('screenerPerfRow', screenerPortfolio.total_performance_pct);
            }
            
            const spyPerf = (customPortfolio && customPortfolio.benchmark) ? customPortfolio.benchmark.performance_pct :
                            (screenerPortfolio && screenerPortfolio.benchmark ? screenerPortfolio.benchmark.performance_pct : 0);
            renderScore('spyPerfRow', spyPerf);

            // 2. Target Active Portfolio for Detailed View
            const p = activeView === 'custom' ? customPortfolio : screenerPortfolio;
            if (!p) return;

            const eq = p.total_equity || p.cash || 10000;
            const perf = p.total_performance_pct || 0;
            const cash = p.cash || 0;

            document.getElementById('totalEquity').innerText = '$' + eq.toLocaleString(undefined, {minimumFractionDigits: 2});
            const perfElem = document.getElementById('totalPerf');
            perfElem.innerText = (perf >= 0 ? '+' : '') + perf.toFixed(2) + '%';
            perfElem.className = 'kpi-val ' + (perf >= 0 ? 'pos' : 'neg');
            document.getElementById('cashVal').innerText = '$' + cash.toLocaleString(undefined, {minimumFractionDigits: 2});

            // 3. Render Positions
            const openCont = document.getElementById('openPositionsContainer');
            if (!p.open_positions || p.open_positions.length === 0) {
                openCont.innerHTML = `<div class="empty-card">אין פוזיציות פתוחות כרגע ב${activeView === 'custom' ? 'תיק האישי' : 'תיק הסורק'}.</div>`;
            } else {
                let html = '';
                p.open_positions.forEach(pos => {
                    const pnlPct = pos.current_pnl_pct || 0;
                    const pnlCls = pnlPct >= 0 ? 'pos' : 'neg';
                    html += `
                    <div class="clean-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <span class="t-ticker">$${pos.ticker}</span>
                            <span class="${pnlCls}" style="font-weight:800; font-family:'Plus Jakarta Sans';">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</span>
                        </div>
                        <div class="t-details" style="display:flex; justify-content:space-between;">
                            <span>${pos.shares} מניות @ $${pos.entry_price}</span>
                            <span>שווי: $${(pos.current_value || 0).toLocaleString()}</span>
                            <span>סטופ: $${pos.stop_loss}</span>
                            <span>יעד: $${pos.target_1}</span>
                        </div>
                    </div>`;
                });
                openCont.innerHTML = html;
            }

            // 4. Render History
            const histCont = document.getElementById('closedTradesContainer');
            if (!p.closed_trades || p.closed_trades.length === 0) {
                histCont.innerHTML = '<div class="empty-card">טרם נרשמו עסקאות סגורות בהיסטוריה.</div>';
            } else {
                let html = '';
                p.closed_trades.slice().reverse().forEach(t => {
                    const pnl = t.pnl || 0;
                    const pnlCls = pnl >= 0 ? 'pos' : 'neg';
                    html += `
                    <div class="trade-row">
                        <div>
                            <span class="t-ticker">$${t.ticker}</span>
                            <div class="t-details">${t.opened_at} ➔ ${t.closed_at} (${t.reason})</div>
                        </div>
                        <div style="text-align:left;">
                            <div class="${pnlCls}" style="font-family:'Plus Jakarta Sans'; font-weight:800;">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</div>
                            <div class="t-details">${t.shares} מניות @ $${t.entry_price} ➔ $${t.exit_price}</div>
                        </div>
                    </div>`;
                });
                histCont.innerHTML = html;
            }
        }

        async function submitManualTrade() {
            const ticker = document.getElementById('inTicker').value.trim().toUpperCase();
            const shares = parseInt(document.getElementById('inShares').value);
            const entry = parseFloat(document.getElementById('inEntry').value);
            const stop = parseFloat(document.getElementById('inStop').value);
            const tp1 = parseFloat(document.getElementById('inTp1').value);
            const tp2 = parseFloat(document.getElementById('inTp2').value) || (tp1 * 1.05);
            const token = document.getElementById('ghToken').value.trim();

            if (!ticker || !shares || !entry || !stop || !tp1 || !token) {
                alert("נא למלא את כל השדות כולל Personal Access Token!");
                return;
            }

            const totalCost = shares * entry;
            if (!customPortfolio || customPortfolio.cash < totalCost) {
                alert("אין מספיק מזומן פנוי בתיק האישי לביצוע העסקה!");
                return;
            }

            customPortfolio.cash = Math.round((customPortfolio.cash - totalCost) * 100) / 100;
            const newPos = {
                ticker,
                shares,
                entry_price: entry,
                stop_loss: stop,
                target_1: tp1,
                target_2: tp2,
                opened_at: new Date().toLocaleDateString('en-GB'),
                trailing_active: false,
                current_price: entry,
                current_pnl_pct: 0.0,
                current_value: totalCost,
                days_active: 0
            };

            customPortfolio.open_positions.push(newPos);

            try {
                const owner = "ororer";
                const repo = "simulator";
                const path = "data/portfolio_custom.json";
                const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

                const getResp = await fetch(url, { headers: { Authorization: `token ${token}` } });
                const fileData = await getResp.json();
                const sha = fileData.sha;

                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(customPortfolio, null, 2))));
                const putResp = await fetch(url, {
                    method: "PUT",
                    headers: { Authorization: `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: `Manual trade: $${ticker} (${shares} shares)`,
                        content: contentEncoded,
                        sha: sha
                    })
                });

                if (putResp.ok) {
                    alert("העסקה נשמרה בתיק האישי וסונכרנה ל-GitHub!");
                    renderUI();
                } else {
                    alert("שגיאה בסנכרון ל-GitHub API. בדוק את ה-Token וההרשאות.");
                }
            } catch(e) {
                alert("שגיאה בביצוע הקריאה: " + e.message);
            }
        }

        fetchAllData();
    </script>
</body>
</html>
