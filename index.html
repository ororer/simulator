<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קרב התיקים: עצמאי מול סורק</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
        }
        .card h2 {
            margin-top: 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            font-size: 1.25rem;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .green { color: #4ade80; font-weight: bold; }
        .red { color: #f87171; font-weight: bold; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        th, td {
            text-align: right;
            padding: 10px 6px;
            border-bottom: 1px solid #334155;
        }
        th {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .tag {
            background: #0ea5e9;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚔️ קרב התיקים: מסחר עצמאי מול סורק שוק</h1>
        
        <div class="grid">
            <!-- כרטיס תיק עצמאי -->
            <div class="card" id="custom-card">
                <h2>🎯 תיק עצמאי (Watchlist)</h2>
                <div class="stat-row">
                    <span>שווי תיק:</span>
                    <span id="custom-equity">$0</span>
                </div>
                <div class="stat-row">
                    <span>תשואה מצטברת:</span>
                    <span id="custom-return">0%</span>
                </div>
                <div class="stat-row">
                    <span>מזומן פנוי:</span>
                    <span id="custom-cash">$0</span>
                </div>
                
                <h3>פוזיציות פתוחות</h3>
                <table>
                    <thead>
                        <tr>
                            <th>טיקר</th>
                            <th>מחיר כניסה</th>
                            <th>יעד רווח</th>
                            <th>סטופ לוס</th>
                        </tr>
                    </thead>
                    <tbody id="custom-positions"></tbody>
                </table>
            </div>

            <!-- כרטיס תיק סורק -->
            <div class="card" id="screener-card">
                <h2>🔍 תיק סורק (Broad Screener)</h2>
                <div class="stat-row">
                    <span>שווי תיק:</span>
                    <span id="screener-equity">$0</span>
                </div>
                <div class="stat-row">
                    <span>תשואה מצטברת:</span>
                    <span id="screener-return">0%</span>
                </div>
                <div class="stat-row">
                    <span>מזומן פנוי:</span>
                    <span id="screener-cash">$0</span>
                </div>

                <h3>פוזיציות פתוחות</h3>
                <table>
                    <thead>
                        <tr>
                            <th>טיקר</th>
                            <th>מחיר כניסה</th>
                            <th>יעד רווח</th>
                            <th>סטופ לוס</th>
                        </tr>
                    </thead>
                    <tbody id="screener-positions"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadPortfolioData() {
            try {
                const [resCustom, resScreener] = await Promise.all([
                    fetch('data/portfolio_custom.json?t=' + Date.now()),
                    fetch('data/portfolio_screener.json?t=' + Date.now())
                ]);
                const custom = await resCustom.json();
                const screener = await resScreener.json();

                renderCard('custom', custom);
                renderCard('screener', screener);
            } catch (err) {
                console.error("שגיאה בטעינת הנתונים:", err);
            }
        }

        function renderCard(prefix, data) {
            document.getElementById(`${prefix}-equity`).textContent = `$${data.current_equity?.toLocaleString() || data.cash?.toLocaleString()}`;
            document.getElementById(`${prefix}-cash`).textContent = `$${Math.round(data.cash)?.toLocaleString()}`;
            
            const retElem = document.getElementById(`${prefix}-return`);
            const ret = data.return_pct || 0;
            retElem.textContent = `${ret > 0 ? '+' : ''}${ret.toFixed(2)}%`;
            retElem.className = ret >= 0 ? 'green' : 'red';

            const tbody = document.getElementById(`${prefix}-positions`);
            tbody.innerHTML = '';
            
            const positions = Object.entries(data.positions || {});
            if (positions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#64748b;">אין פוזיציות פתוחות כרגע</td></tr>';
                return;
            }

            for (const [ticker, pos] of positions) {
                tbody.innerHTML += `
                    <tr>
                        <td><span class="tag">${ticker}</span></td>
                        <td>$${pos.entry_price}</td>
                        <td class="green">$${pos.take_profit}</td>
                        <td class="red">$${pos.stop_loss}</td>
                    </tr>
                `;
            }
        }

        loadPortfolioData();
    </script>
</body>
</html>
